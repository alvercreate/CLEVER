<form action="https://www.google.com" id="UserEnter1" name="UserEnter1" target="_blank">

  <div class="mb-3">

  <div class="mb-3">
    <label for="rating" class="form-label">Оценка (1–10)</label>

      <input class="form-check-input" type="radio" name="recommend" id="rec1" value="да" checked>

    <div class="form-check">
      <input class="form-check-input" type="radio" name="recommend" id="rec2" value="нет">
      <label class="form-check-label" for="rec2">Нет</label>
    </div>
  </div>
  <button type="submit" class="btn btn-primary">Отправить</button>
</form>
